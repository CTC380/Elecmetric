name: Elecmetric | Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older run that is still building; a deploy that has started is never cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Deploy gate: only what can break the live site. Runs in parallel with "full-tests".
  build:
    name: Gate, build and audit site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://elecmetric.com' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # add_lastmod.js needs full Git history

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy-critical tests (core engine, routing, site structure, links)
        run: node tests/ci_suite.js gate

      - name: Build production pages and run deployment guard
        run: |
          node tools/build_pages.js
          node tools/add_lastmod.js sitemap.xml
          REQUIRE_LASTMOD=1 node tools/check_deploy.js

      - name: Assemble and audit GitHub Pages upload
        run: |
          mkdir _site
          cp -r index.html 404.html privacy.html terms.html engine.js search-index.js home-data.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png logo.png og-image.png robots.txt sitemap.xml pages calculators categories converters technical-library _site/
          touch _site/.nojekyll
          node tools/check_assets.js _site --production
          node tools/check_site.js _site sitemap.xml

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Full suite: complete run_tests.js (page generation re-checks), committed-page drift and every per-calculator vector suite. Runs in parallel with the gate on every push and pull request.
  # They do NOT hold up deployment. To make them block it, add "full-tests" to the deploy job's needs.
  full-tests:
    name: Full test suite (non-blocking for deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run the full suite in parallel
        run: node tests/ci_suite.js full

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
